name: Scrape UJB Dashboard Data

# Scheduled workflow hanya aktif dari default branch GitHub. Pada feature branch
# workflow ini tetap bisa diuji lewat tombol "Run workflow".
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Hindari dua scraper menulis ujb_history.csv pada branch yang sama bersamaan.
concurrency:
  group: ujb-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright pandas
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          UJB_USERNAME: ${{ secrets.UJB_USERNAME }}
          UJB_PASSWORD: ${{ secrets.UJB_PASSWORD }}
          UJB_OUTPUT_DIR: ${{ github.workspace }}/data/raw
          # 7 hari kalender inklusif memakai timezone Asia/Jakarta di scraper.
          UJB_LOOKBACK_DAYS: "7"
        run: python ujb_dashboard_scraper.py

      - name: Commit & push kalau ada data baru
        run: |
          git config user.name "ujb-scraper-bot"
          git config user.email "actions@github.com"
          git add data/raw/ujb_scraped_latest.csv data/raw/ujb_history.csv
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data, skip commit."
          else
            git commit -m "chore: update UJB snapshot and history [skip ci]"
            git push
          fi
