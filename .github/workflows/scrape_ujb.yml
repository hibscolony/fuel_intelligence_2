name: Scrape UJB Dashboard Data

# Scheduled workflow hanya aktif dari default branch GitHub. Pada feature branch
# workflow ini tetap bisa diuji lewat tombol "Run workflow".
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Hindari dua scraper menulis ujb_history.csv pada branch yang sama bersamaan.
concurrency:
  group: ujb-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      # Pastikan import `src.*` / `config` deterministik baik lewat pytest
      # maupun script validator, independen dari import-mode pytest/runner.
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          pip install playwright pandas
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          UJB_USERNAME: ${{ secrets.UJB_USERNAME }}
          UJB_PASSWORD: ${{ secrets.UJB_PASSWORD }}
          UJB_OUTPUT_DIR: ${{ github.workspace }}/data/raw
          # 7 hari kalender inklusif memakai timezone Asia/Jakarta.
          UJB_LOOKBACK_DAYS: "7"
        run: python ujb_scrape_runner.py

      # Simpan data UJB dulu. Kalau validasi hybrid setelah ini menemukan bug,
      # hasil scrape tetap tidak hilang dari branch.
      - name: Commit & push kalau ada data UJB baru
        run: |
          git config user.name "ujb-scraper-bot"
          git config user.email "actions@github.com"
          git add \
            data/raw/ujb_scraped_latest.csv \
            data/raw/ujb_history.csv \
            data/raw/ujb_filter_diagnostics.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data UJB, skip commit."
          else
            git commit -m "chore: update UJB snapshot and history [skip ci]"
            # Branch dapat maju setelah checkout (mis. ada commit kode baru).
            # Rebase commit data ke HEAD remote terbaru sebelum push agar tidak
            # gagal dengan non-fast-forward / fetch-first.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Validasi hybrid sengaja hanya untuk manual dispatch. Scheduled scraper
      # tetap ringan dan tidak menjalankan seluruh dependency/test tiap 30 menit.
      - name: Install hybrid validation dependencies
        if: github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Run source-aware regression tests
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pytest -q \
            tests/test_source_reconciliation.py \
            tests/test_forecast_data.py \
            tests/test_ujb_unit_mapping.py

      - name: Validate real hybrid pipeline
        if: github.event_name == 'workflow_dispatch'
        env:
          FUEL_DATA_SOURCE: hybrid
        run: python scripts/validate_hybrid_sources.py

      - name: Commit hybrid validation outputs
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          if [ ! -f data/processed/source_reconciliation_audit.csv ] && \
             [ ! -f data/processed/hybrid_validation_summary.json ]; then
            echo "Tidak ada output validator untuk disimpan."
            exit 0
          fi

          git config user.name "hybrid-validator-bot"
          git config user.email "actions@github.com"
          git add \
            data/processed/source_reconciliation_audit.csv \
            data/processed/hybrid_validation_summary.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Output validasi tidak berubah."
          else
            git commit -m "chore: update hybrid validation audit [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
